name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Zip'leri aç, projeyi bul
        run: |
          shopt -s nullglob
          for z in *.zip; do
            echo "Açılıyor: $z"
            unzip -oq "$z" -d _src
          done
          CFG=$(find . -name capacitor.config.json -not -path '*/node_modules/*' | head -1)
          if [ -z "$CFG" ]; then
            echo "::error::capacitor.config.json bulunamadı. Depoda şunlar var:"
            ls -la
            exit 1
          fi
          APP_DIR=$(dirname "$CFG")
          echo "APP_DIR=$APP_DIR" >> "$GITHUB_ENV"
          echo "Proje klasörü: $APP_DIR"
          ls -la "$APP_DIR"

      - name: Supabase ayarı yapılmış mı?
        run: |
          if grep -q "YOUR-" "$APP_DIR/www/config.js"; then
            echo "::error::www/config.js örnek değerlerle dolu"
            exit 1
          fi

      - name: Sürüm bilgisini uygulamaya yaz
        run: |
          cat > "$APP_DIR/www/version.js" <<VER
          window.APP_VERSION=${{ github.run_number }};
          window.APP_REPO='${{ github.repository }}';
          VER
          cat "$APP_DIR/www/version.js"

      - name: Sabit imza anahtarı (güncellemenin kurulabilmesi için)
        env:
          KS_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          mkdir -p ~/.android
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > ~/.android/debug.keystore
            echo "Anahtar: GitHub Secrets"
          elif [ -f "$APP_DIR/debug.keystore" ]; then
            cp "$APP_DIR/debug.keystore" ~/.android/debug.keystore
            echo "Anahtar: depodaki debug.keystore"
          else
            echo "::warning::debug.keystore yok, her derleme farklı imzalanır; güncelleme kurulamaz"
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Android projesini hazırla
        run: |
          cd "$APP_DIR"
          npm install
          npx cap add android
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/; s/versionName \"1.0\"/versionName \"${{ github.run_number }}\"/" android/app/build.gradle
          grep -n "versionCode\|versionName" android/app/build.gradle
          npx cap sync android

      - name: APK derle
        run: |
          cd "$APP_DIR/android"
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: uye-kayit-apk
          path: ${{ env.APP_DIR }}/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Release yayınla (uygulama buradan güncelleme bulur)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          N=${{ github.run_number }}
          cp "$APP_DIR/android/app/build/outputs/apk/debug/app-debug.apk" "uye-kayit-v$N.apk"
          gh release create "v$N" "uye-kayit-v$N.apk" --repo "${{ github.repository }}" --title "v$N" --notes "Otomatik sürüm $N" --latest
